<footer>Hazırlayan: Işıl Tabağ · Kitap: Walter Isaacson, <em>The Code Breaker: Jennifer Doudna, Gene Editing, and the Future of the Human Race</em> (2021). Kitaptaki tarih, sayı ve şirket örnekleri, kitabın yazıldığı döneme ait tarihsel örneklerdir.</footer>
<script>
const SECTIONS = {
  A: "Merak ve yaşamın dili",
  B: "CRISPR'ın keşfi",
  C: "Tedaviden CRISPR bebeklerine",
  D: "Etik ve gelecek"
};

const PART1 = [
{
 id:"a1", sec:"A", chapter:"Bölüm 1, 6 ve 7 · Hilo, RNA, Kıvrımlar",
 title:"Merakla başlayan bir yol: Yapı işlevi belirler",
 html:`
<p class="lead">Jennifer Doudna 1971'de, yedi yaşındayken ailesiyle Hawaii'deki volkanik Hilo kasabasına taşınır. Okulda kendini yabancı hisseder, ama doğa onu büyüler: Lav tünellerindeki gözsüz örümcekler ve dokununca yapraklarını kapatan "uyuyan ot" (sleeping grass). Sorusu basittir: <strong>Dokununca yaprakların kapanmasına ne sebep oluyor?</strong></p>
<p>Altıncı sınıftayken babası yatağının üzerine James Watson'ın <em>Çift Sarmal</em> (The Double Helix) kitabını bırakır. Jennifer onu bir dedektif romanı sanar. Kitaptan iki şey alır: Bir kadının da büyük bir bilim insanı olabileceğini (Rosalind Franklin'in hikâyesi) ve kariyerini şekillendirecek fikri: <strong>Bir molekülün biçimi ve yapısı, oynayabileceği biyolojik rolü belirler.</strong></p>
<h3>Neden DNA değil de RNA?</h3>
<p>Crick'in "merkezî dogma" (central dogma) dediği akışta bilgi DNA'dan haberci RNA'ya (messenger RNA), oradan proteine geçer. 1980'lerde Thomas Cech ve Sidney Altman bazı RNA'ların enzim gibi de çalışabildiğini keşfeder: <strong>ribozimler</strong> (ribozymes). Yani RNA hem bilgi taşıyabilir hem de tepkime yürütebilir. Bu yüzden birçok bilim insanı, yaşamın başlangıcında kendini kopyalayabilen RNA'nın olduğunu düşünür: "RNA dünyası" (RNA world) hipotezi.</p>
<p>Doudna Harvard'da Jack Szostak'ın laboratuvarında RNA üzerinde çalışan ilk lisansüstü öğrenci olur. Szostak'tan iki ders alır: "Bin kişinin yaptığı bir şeyi yapma" ve "Büyük sorular sor." Sonra Yale'de, bir ribozimin üç boyutlu yapısını kristalografiyle (crystallography) çözerek adını duyurur.</p>
<div class="concept"><b class="t">Ana kavram</b><strong>Yapı işlevi belirler:</strong> Bir molekülün nasıl katlandığını ve hangi şekli aldığını bilmek, ne iş yaptığını anlamanın anahtarıdır. Doudna'nın bütün kariyeri bu fikir üzerine kuruludur.</div>
<p class="note">Kitap 2021'de yayımlandı. Kitaptaki tarihler, sayılar ve şirketler kitabın yazıldığı döneme ait tarihsel örneklerdir.</p>`,
 learn:["Doudna'nın bilim yolu çocukluktaki merakla başlar: Hilo'da uyuyan otun neden kapandığını merak eder.","Watson'ın Çift Sarmal kitabından aldığı temel fikir: Bir molekülün yapısı biyolojik işlevini belirler.","Merkezî dogma: Bilgi DNA'dan RNA'ya, RNA'dan proteine akar.","Ribozimler, enzim gibi çalışabilen RNA'lardır; bu keşif 'RNA dünyası' hipotezini güçlendirir.","Szostak'ın dersleri: Bin kişinin yaptığını yapma; büyük sorular sor."],
 q:{
  prompt:"Doudna'nın RNA'ya bu kadar ilgi duymasının kitapta anlatılan en önemli bilimsel nedeni hangisidir?",
  options:[
   {t:"RNA'nın DNA'dan çok daha uzun ve kararlı bir molekül olması", f:"Tam tersi: RNA genelde DNA'dan daha kısa ve daha az kararlıdır. Doudna'yı çeken şey uzunluk değil, RNA'nın yapabildiği işlerin çeşitliliğiydi."},
   {t:"RNA'nın hem bilgi taşıyabilmesi hem de ribozim olarak tepkime yürütebilmesi", f:"", c:true},
   {t:"O yıllarda herkesin RNA üzerinde çalışıyor olması", f:"Aksine, Szostak'ın ilkesi 'Bin kişinin yaptığı bir şeyi asla yapma' idi. Doudna laboratuvarda RNA üzerinde çalışan ilk öğrenciydi; kalabalığı izlemedi."},
   {t:"RNA'nın yalnızca virüslerde bulunması", f:"RNA her canlı hücrede vardır; DNA'daki bilgiyi proteine taşıyan haberci RNA buna örnektir. Ribozimlerin keşfi RNA'nın hücredeki rolünü daha da büyüttü."}
  ],
  good:"RNA hem bilgi saklayabilir hem de ribozim olarak kimyasal tepkimeleri hızlandırabilir. Bu yüzden yaşamın kökeninde olabileceği düşünülür. Doudna da 'yapı işlevi belirler' fikriyle RNA'nın şeklini çözmeye yöneldi."
 }
},
{
 id:"a2", sec:"A", chapter:"Bölüm 9 ve 10 · Kümelenmiş tekrarlar, Özgür Konuşma Hareketi Kafesi",
 title:"CRISPR: Bakterilerin bağışıklık hafızası",
 html:`
<p class="lead">1990'da İspanya'da, Alicante Üniversitesi'nde doktora öğrencisi olan Francisco Mojica, tuzlu bataklıklarda yaşayan mikropları incelerken DNA'da tuhaf bir desen görür: Düzenli aralıklarla tekrar eden, tersten de aynı okunan kısa diziler. Önce bir hata yaptığını sanır.</p>
<p>2001'de bu dizilere bir ad verilir: <strong>CRISPR</strong> (clustered regularly interspaced short palindromic repeats). Yanlarındaki genlerin ürettiği enzimlere de "CRISPR ile ilişkili" anlamında <strong>Cas</strong> enzimleri denir.</p>
<h3>Tatilde gelen buluş</h3>
<p>2003 yazında Mojica, Santa Pola'da tatildeyken kumsala gitmek yerine dizileri bilgisayarda karşılaştırır. Tekrarların arasındaki <strong>ara dizilerin</strong> (spacers) bakterilere saldıran virüslerin dizileriyle eşleştiğini fark eder. Ara diziyi taşıyan bakteriler o virüse karşı bağışıktır. Yani CRISPR, bakterilerin geçmişte karşılaştıkları virüslerin "sabıka fotoğraflarını" sakladığı bir bağışıklık sistemidir.</p>
<p>Bu, gezegenin en eski savaşıdır: Bakteriler ile faj (bacteriophage) denen virüsler yaklaşık üç milyar yıldır savaşmaktadır. Mojica'nın makalesi birkaç dergiden reddedilir ve ancak 2005'te yayımlanır.</p>
<h3>Bir telefon ve bir kafe</h3>
<p>2006'da Berkeley'den mikrobiyolog Jillian Banfield, RNA uzmanı Doudna'yı arar ve onunla kampüsteki Özgür Konuşma Hareketi Kafesi'nde buluşur. Banfield bakterilerde CRISPR dizileri bulmaktadır; sistemin RNA ile çalıştığından şüphelenilmektedir. Doudna o güne kadar CRISPR kelimesini hiç duymamıştır, ama merakı uyanır.</p>
<div class="concept"><b class="t">Ana kavram</b><strong>CRISPR-Cas sistemi:</strong> Bakterinin virüs DNA'sından parçaları kendi genomuna kaydettiği, sonra bu kayıtlardan üretilen RNA ile aynı virüsü tanıyıp Cas enzimleriyle kestiği uyarlanabilir bağışıklık sistemi.</div>`,
 learn:["CRISPR, bakterilerin DNA'sındaki düzenli aralıklı, tekrar eden kısa dizilerdir; ilk kez Francisco Mojica tarafından ayrıntılı incelendi.","Ara diziler (spacers) bakterilere saldıran virüslerin dizileriyle eşleşir; CRISPR bakterinin bağışıklık hafızasıdır.","Bakteriler ile fajlar arasındaki savaş yaklaşık üç milyar yıldır sürer.","Mojica'nın makalesi birkaç kez reddedildi ve ancak 2005'te yayımlandı.","Jillian Banfield 2006'da Doudna'yı arayıp kafede buluşmasıyla Doudna CRISPR dünyasına girdi."],
 q:{
  prompt:"Mojica 2003'te CRISPR'ın işlevi hakkında neyi fark etti?",
  options:[
   {t:"Tekrar dizilerinin hücre bölünmesini kontrol ettiğini", f:"Mojica 1995'te böyle bir tahminde bulunmuştu, ama bu yanlış çıktı. 2003'teki asıl buluş ara dizilerle virüsler arasındaki eşleşmeydi."},
   {t:"CRISPR'ın insan hücrelerinde genleri düzenlemek için hemen kullanılabileceğini", f:"Bu uygulama yaklaşık on yıl sonra, 2012-2013'te geldi. Mojica'yı yönlendiren uygulama değil, doğanın gizemine duyduğu meraktı."},
   {t:"Ara dizilerin, bakterilere saldıran virüslerin dizileriyle eşleştiğini ve bunun bağışıklık sağladığını", f:"", c:true},
   {t:"CRISPR dizilerinin sadece insanlarda bulunduğunu", f:"CRISPR dizileri bakterilerde ve arkelerde (tek hücreli, çekirdeksiz canlılar) bulunur. Mojica tuzlu bataklıklardaki mikropları inceliyordu."}
  ],
  good:"Ara diziler virüs dizileriyle eşleşiyordu ve bu diziyi taşıyan bakteriler o virüse bağışıktı. CRISPR, bakterinin uyarlanabilir bağışıklık sistemiydi. Merakla yapılan temel bilim, ileride büyük bir teknolojinin kapısını açtı."
 }
},
{
 id:"a3", sec:"B", chapter:"Bölüm 12 · Yoğurt üreticileri",
 title:"Temel bilim ve uygulamalı bilim el ele",
 html:`
<p class="lead">CRISPR'ın hikâyesinde beklenmedik kahramanlar da vardır: yoğurt ve peynir üreticileri. Yoğurt ve peynir, bakteri kültürleriyle yapılır. Bu bakterileri öldüren virüsler, milyarlarca dolarlık bir sektörün en büyük tehdididir.</p>
<p>Danimarkalı gıda şirketi Danisco'da çalışan iki genç bilim insanı, Rodolphe Barrangou ve Philippe Horvath, şirketin yıllar boyunca sakladığı bakteri arşivini inceler. 2005'te bir "Evreka" anı yaşarlar: Virüs saldırısından sağ çıkan bakteriler, o virüsten aldıkları <strong>yeni ara dizileri</strong> taşımaktadır.</p>
<h3>Bilimden ürüne, üründen bilime</h3>
<p>Barrangou ve Horvath, bakterilerin CRISPR bölgesine virüs dizileri ekleyerek bağışıklığı bilerek oluşturabildiklerini, <strong>Cas9</strong> gibi enzimler devre dışı kalınca direncin kaybolduğunu gösterirler. Makaleleri 2007'de Science'ta yayımlanır. Bugün CRISPR yoğurt kültürlerini korumak için kullanılmaktadır.</p>
<p>Isaacson burada "doğrusal yenilik modeli" (linear model of innovation) fikrini tartışır: Önce temel bilim, sonra uygulama, sonra ürün. Bu modelde doğruluk payı vardır, ama süreç çoğu zaman <strong>iki yönlüdür</strong>. CRISPR'da da durum böyledir: Tuzlu bataklık mikroplarını merak eden Mojica'nın temel bilimi ile yoğurt üreticilerinin pratik sorunu birbirini besler.</p>
<div class="concept"><b class="t">Ana kavram</b><strong>Temel ve uygulamalı bilimin ortaklığı:</strong> Doğayı anlamak için yapılan araştırma ile pratik bir sorunu çözmek için yapılan araştırma birbirinden kopuk değildir; biri diğerine yeni sorular ve araçlar kazandırır.</div>`,
 learn:["Yoğurt ve peynir kültürlerini koruma ihtiyacı CRISPR araştırmasını hızlandırdı.","Danisco'dan Barrangou ve Horvath, virüs saldırısından sağ çıkan bakterilerin yeni ara diziler kazandığını gösterdi.","Ara dizi ekleyerek bağışıklık oluşturulabildi; Cas9 devre dışı kalınca direnç kayboldu (Science, 2007).","Doğrusal yenilik modeli kısmen doğrudur; ama temel ve uygulamalı bilim genelde iki yönlü bir ilişki içindedir."],
 q:{
  prompt:"Yoğurt üreticilerinin hikâyesi, kitabın bilim anlayışı hakkında en çok neyi gösterir?",
  options:[
   {t:"Gerçek bilimin yalnızca üniversitelerde yapılabileceğini", f:"Barrangou ve Horvath bir gıda şirketinde çalışıyordu ve CRISPR'ın işleyişine dair çok önemli bir kanıt buldular. Bilim farklı yerlerde yapılabilir."},
   {t:"Şirketlerin temel bilime hiçbir katkısı olmadığını", f:"Danisco'nun bakteri arşivi ve pratik sorunu, CRISPR'ın bağışıklık sistemi olduğunu doğrulayan kanıtı sağladı. Yani şirketin katkısı büyüktü."},
   {t:"Temel bilim ile uygulamalı bilimin birbirini beslediğini; sürecin tek yönlü olmadığını", f:"", c:true},
   {t:"Pratik sorunlarla uğraşmanın bilimsel merakı öldürdüğünü", f:"Tam tersine, yoğurt bakterilerini koruma sorunu CRISPR'a dair temel soruların cevaplanmasına yardım etti. Pratik bir soru merakı besleyebilir."}
  ],
  good:"Isaacson'a göre temel ve uygulamalı bilim bir 'çağrı ve cevap düeti' gibidir. Mojica'nın merakı ile Danisco'nun pratik sorunu birleşti; CRISPR'ın bir bağışıklık sistemi olduğu böyle kanıtlandı."
 }
},
{
 id:"a4", sec:"B", chapter:"Bölüm 16, 17 ve 18 · Charpentier, CRISPR-Cas9, Science 2012",
 title:"Programlanabilir bir makas: CRISPR-Cas9",
 html:`
<p class="lead">Mart 2011'de Porto Riko'daki bir konferansta Doudna, Fransız mikrobiyolog Emmanuelle Charpentier ile tanışır. Eski San Juan'ın arnavut kaldırımlı sokaklarında yürürken Charpentier şunu söyler: Cas9'un nasıl kestiğini anlamak için bir biyokimyacıya ve yapısal biyoloğa ihtiyacı vardır. "Birlikte çalışalım."</p>
<p>Charpentier daha önce sistemde gizli bir parça bulmuştur: <strong>tracrRNA</strong>. Doudna'nın laboratuvarından Martin Jinek ile Charpentier'in ekibinden Krzysztof Chylinski, farklı ülkelerden Skype ile çalışarak 24 saat süren bir iş birliği kurarlar.</p>
<h3>Üç bileşen, bir makas</h3>
<p>Deneyler şunu gösterir: Cas9'un DNA'yı kesmesi için iki RNA gereklidir. <strong>crRNA</strong> hedefi gösteren kılavuzdur; <strong>tracrRNA</strong> ise crRNA'yı Cas9'a bağlayan bir tutamaktır. Üçü birlikte olunca Cas9 hedef DNA'nın iki ipliğini birden keser.</p>
<p>Büyük fikir şudur: Kılavuz RNA <strong>istenen herhangi bir DNA dizisine göre değiştirilebilir</strong>. Jinek ve Doudna bir adım daha atar: İki RNA'yı tek bir molekülde birleştirirler: <strong>tek kılavuz RNA</strong> (single-guide RNA). Böylece sistem çok daha kolay programlanır.</p>
<p>Makale 8 Haziran 2012'de Science'a gönderilir ve aynı ay yayımlanır. Bilim tarihinde gerçek "Evreka" anları azdır; ama bu ona çok yakındır: Hayatın kodunu düzenlemenin kolay bir yolu bulunmuştur.</p>
<div class="concept"><b class="t">Ana kavram</b><strong>CRISPR-Cas9:</strong> Kılavuz RNA'nın gösterdiği yerde DNA'yı kesen Cas9 enziminden oluşan, kılavuz değiştirilerek istenen gene yönlendirilebilen gen düzenleme aracı.</div>`,
 learn:["Doudna ile Charpentier Mart 2011'de Porto Riko'da tanıştı; farklı becerileri birleştirmek için iş birliği kurdular.","Cas9'un kesmesi için crRNA (kılavuz) ve tracrRNA (tutamak) birlikte gereklidir.","Kılavuz RNA değiştirilerek Cas9 istenen herhangi bir DNA dizisine yönlendirilebilir.","Jinek ve Doudna iki RNA'yı tek kılavuz RNA'da birleştirdi; sistem kolay programlanabilir bir araç oldu.","Makale Haziran 2012'de Science'ta yayımlandı; ilk yazarlar Jinek ve Chylinski'ydi."],
 q:{
  prompt:"2012 makalesini bir 'gen düzenleme aracı' hâline getiren en önemli fikir hangisidir?",
  options:[
   {t:"Kılavuz RNA'nın değiştirilerek Cas9'un istenen herhangi bir DNA dizisine yönlendirilebilmesi", f:"", c:true},
   {t:"Cas9'un DNA'yı rastgele yerlerden kesmesi", f:"Rastgele kesen bir enzim düzenleme aracı olamaz. CRISPR-Cas9'un gücü tam tersine çok hedefli olmasıdır: Kılavuz RNA'nın gösterdiği yeri keser."},
   {t:"tracrRNA'nın sisteme gerekli olmadığının anlaşılması", f:"Deneyler tam tersini gösterdi: tracrRNA olmadan crRNA Cas9'a bağlanamıyor ve kesim olmuyordu. Sonra iki RNA tek kılavuzda birleştirildi."},
   {t:"Sistemin yalnızca yoğurt bakterilerinde çalışması", f:"Makalenin önemi, sistemin her DNA dizisini hedefleyebilecek şekilde programlanabileceğini göstermesiydi; bu da başka canlılarda kullanımın yolunu açtı."}
  ],
  good:"CRISPR-Cas9'u devrim yapan şey programlanabilirlikti: Kılavuz RNA'yı değiştirince makas başka bir gene gider. Tek kılavuz RNA bunu daha da kolaylaştırdı."
 }
},
{
 id:"a5", sec:"B", chapter:"Bölüm 21-27 · Yarış",
 title:"Bilim bir takım oyunu ve bir yarış",
 html:`
<p class="lead">2012 makalesi CRISPR'ın deney tüpünde çalıştığını gösterdi. Sıradaki büyük soru şuydu: <strong>İnsan hücrelerinde de çalışacak mı?</strong> Bu soru, kitabın en heyecanlı yarışını başlatır.</p>
<p>Yarışın üç ana oyuncusu vardır: Broad Enstitüsü'nden genç ve hırslı <strong>Feng Zhang</strong>, Harvard'dan efsanevi genetikçi <strong>George Church</strong> ve insan hücreleriyle çalışan bir ekibi olmayan ama hızla yetişmeye çalışan <strong>Doudna</strong>.</p>
<h3>Fotoğraf finişi</h3>
<p>Zhang, sistemi insan hücrelerinde daha iyi çalıştırmak için kılavuz RNA'yı uzatır ve Cas9'u insan hücresine göre uyarlar. Makalesini Ekim 2012'de gönderir. Church'ün makalesi üç hafta sonra gelir; ikisi de 3 Ocak 2013'te birlikte yayımlanır. Doudna'nın makalesi 29 Ocak 2013'te çıkar; aynı ay başka ekiplerin de benzer sonuçları vardır.</p>
<p>Isaacson'a göre bu, buluş tüpte gösterildikten sonra bu adımın neredeyse kaçınılmaz olduğunu düşündürür. Yarış daha sonra patent davalarına, şirketlere ve kırgınlıklara dönüşür.</p>
<h3>Rekabetin iki yüzü</h3>
<p>Doudna'ya göre sağlıklı rekabet büyük keşifleri körükler: İlk olmanın ödülleri (makale, patent, ödül, takdir) bilim insanlarını hızlandırır. Ama rekabet gizliliğe ve veri paylaşımının kısıtlanmasına da yol açabilir. Ve hiçbir büyük buluş tek kişinin eseri değildir: Öğrenciler, doktora sonrası araştırmacılar, farklı ülkelerden ortaklar hep sahnededir.</p>
<div class="concept"><b class="t">Ana kavram</b><strong>Bilimde iş birliği ve rekabet:</strong> Bilim hem ortak bir çabadır hem de ilk olma yarışıdır. Rekabet hızlandırır; ama açık paylaşım ve dürüst emek takdiri olmadan güveni zedeler.</div>`,
 learn:["2012 sonrası yarışın sorusu: CRISPR insan hücrelerinde çalışacak mı?","Üç oyuncu: Feng Zhang (Broad), George Church (Harvard) ve Jennifer Doudna (Berkeley).","Zhang ve Church'ün makaleleri 3 Ocak 2013'te, Doudna'nınki 29 Ocak 2013'te yayımlandı.","Yarış sonradan patent davalarına ve şirket rekabetine dönüştü.","Rekabet keşfi hızlandırır ama gizlilik ve kırgınlık da doğurabilir; büyük buluşlar ekip işidir."],
 q:{
  prompt:"Kitaba göre bilimdeki rekabet hakkında hangisi en dengeli değerlendirmedir?",
  options:[
   {t:"Rekabet her zaman zararlıdır; bilim insanları hiç yarışmamalıdır", f:"Doudna'ya göre sağlıklı rekabet birçok büyük keşfi körüklemiştir. Kitap rekabeti tümden kötü görmez."},
   {t:"Önemli olan yalnızca ilk olmaktır; kimin yardım ettiği önemsizdir", f:"Kitap boyunca öğrencilerin, doktora sonrası araştırmacıların ve ortakların emeği vurgulanır. Emeği görmezden gelmek bilimdeki güveni zedeler."},
   {t:"Buluşlar tek bir dâhinin eseridir; ekip çalışması ikinci plandadır", f:"CRISPR hikâyesi tam tersini gösterir: Mojica'dan yoğurt bilimcilerine, Jinek ve Chylinski'den Zhang ve Church'e kadar birçok kişi ve ekip katkı yaptı."},
   {t:"Rekabet keşfi hızlandırabilir, ama gizlilik ve kırgınlık gibi bedelleri de vardır", f:"", c:true}
  ],
  good:"Rekabet bilim insanlarını hızlandırır, hasta tedavisini öne çekebilir; ama gizlilik, patent kavgaları ve kırgınlık gibi bedelleri de vardır. Kitap bu iki yüzü birlikte gösterir."
 }
},
{
 id:"a6", sec:"C", chapter:"Bölüm 32 · Tedaviler",
 title:"Somatik tedavi: Victoria Gray'in hikâyesi",
 html:`
<p class="lead">Temmuz 2019'da Nashville'de bir hastanede doktor Haydar Frangoul, Mississippi'den gelen 34 yaşındaki Victoria Gray'e kendi kanından alınıp CRISPR ile düzenlenmiş kök hücreleri verir. Dört çocuk annesi Gray, bebekliğinden beri ağır ağrılar çektiği orak hücre hastalığı (sickle-cell anemia) için ABD'de CRISPR ile tedavi edilen ilk kişi olur.</p>
<h3>Orak hücre hastalığı nedir?</h3>
<p>Hastalık, üç milyardan fazla baz çifti içinde <strong>tek bir harfteki</strong> mutasyondan kaynaklanır. Kırmızı kan hücreleri orak biçimini alır ve damarları tıkar. Doktorlar Gray'in hücrelerinde, normalde yalnızca anne karnında üretilen sağlıklı <strong>fetal hemoglobini</strong> üreten geni yeniden etkinleştirir. Haziran 2020'ye gelindiğinde Gray dokuz ay boyunca hiç ağrı krizi yaşamamıştır. "Kızlarımın gelinliklerini seçmelerine yardım etmek için orada olacağım" der.</p>
<h3>Ex vivo ve in vivo</h3>
<p>Bu tedavi <strong>somatik</strong> (somatic) bir düzenlemedir: Yalnızca hastanın vücut hücrelerini değiştirir ve çocuklarına geçmez. Hücreler vücut dışında düzenlenip geri verilir: <strong>ex vivo</strong>. Bir başka yol, aracı doğrudan vücuttaki hücrelere ulaştırmaktır: <strong>in vivo</strong>. Mart 2020'de Portland'da doğuştan körlüğe yol açan bir mutasyonu düzeltmek için gözün içine CRISPR enjekte edilmesi buna örnektir.</p>
<h3>Ama kim karşılayacak?</h3>
<p>Bu tedaviler başlangıçta hasta başına bir milyon dolar ya da daha fazlasına mal olabilir (kitabın yazıldığı dönemin tahmini). Doudna maliyeti düşürmeyi ekibinin temel hedeflerinden biri yapar; amaç tedaviyi hastanın vücudunda, kemik iliğini çıkarmadan yapabilmektir.</p>
<div class="concept"><b class="t">Ana kavram</b><strong>Somatik düzenleme:</strong> Yalnızca kişinin vücut hücrelerinde yapılan, gelecek kuşaklara aktarılmayan düzenleme. Bilimsel ve etik açıdan germ hattı düzenlemesinden çok daha az tartışmalıdır.</div>`,
 learn:["Victoria Gray, Temmuz 2019'da ABD'de orak hücre için CRISPR ile tedavi edilen ilk kişi oldu.","Orak hücre hastalığı tek bir harflik mutasyondan kaynaklanır; tedavide fetal hemoglobin geni yeniden etkinleştirildi.","Somatik düzenleme yalnızca hastayı etkiler, çocuklara geçmez.","Ex vivo: hücreler vücut dışında düzenlenir; in vivo: düzenleme vücut içinde yapılır (ör. göz tedavisi).","Bu tedavilerin çok pahalı olması (o dönemde hasta başı yaklaşık bir milyon dolar) bir adalet sorunudur."],
 q:{
  prompt:"Victoria Gray'e uygulanan tedavi hangi türe girer?",
  options:[
   {t:"Germ hattı düzenlemesi; çünkü değişiklik çocuklarına da geçer", f:"Gray'in kan kök hücreleri düzenlendi; yumurta, sperm ya da embriyo değil. Bu yüzden değişiklik çocuklarına geçmez. Germ hattı düzenlemesi değildir."},
   {t:"Somatik ve ex vivo düzenleme; hücreler vücut dışında düzenlenip geri verildi", f:"", c:true},
   {t:"İyileştirme (enhancement); çünkü normal bir özellik güçlendirildi", f:"Gray'in ağır bir hastalığı vardı ve tedavi onu hastalığın acısından kurtarmayı amaçladı. Bu bir tedavidir, iyileştirme değil."},
   {t:"Aşı; çünkü bağışıklık sistemini uyarıyor", f:"Tedavi bağışıklık sistemini uyarmadı; kan kök hücrelerinin DNA'sını değiştirerek sağlıklı hemoglobin üretilmesini sağladı."}
  ],
  good:"Gray'in kendi kök hücreleri vücut dışında düzenlenip geri verildi: somatik ve ex vivo bir tedavi. Değişiklik yalnızca onu etkiler, çocuklarına geçmez."
 }
},
{
 id:"a7", sec:"C", chapter:"Bölüm 37, 38 ve 39 · He Jiankui, Hong Kong zirvesi, Kabullenme",
 title:"Germ hattı ve ilk CRISPR bebekleri",
 html:`
<p class="lead">Kasım 2018'de dünya şaşkın bir haberle uyanır: Çinli bilim insanı He Jiankui, embriyolarında CRISPR ile düzenleme yaptığı ikiz kızların, Lulu ve Nana'nın doğduğunu açıklar.</p>
<h3>Ne yaptı?</h3>
<p>He, babanın HIV pozitif olduğu çiftleri seçer ve embriyolarda HIV'in hücrelere girmek için kullandığı <strong>CCR5</strong> genini düzenler. Gerekçesi bebekleri HIV'den korumaktır. Bu bir <strong>germ hattı düzenlemesidir</strong> (germline editing): Değişiklik embriyonun tüm hücrelerine ve gelecek kuşaklara geçer.</p>
<h3>Neden bu kadar tepki gördü?</h3>
<ul class="clean">
<li><strong>Tıbbi gereklilik yoktu:</strong> Babanın sperminin HIV'den arındırılması tek başına bebekleri korumak için muhtemelen yeterliydi; düzenleme bir hastalığı düzeltmiyordu.</li>
<li><strong>Özensiz bir işti:</strong> Lulu'da genin yalnızca bir kopyası düzenlenmişti; hedef dışı (off-target) düzenleme ve <strong>mozaiklik</strong> (mosaic, bazı hücrelerin düzenlenmemiş olması) belirtileri vardı.</li>
<li><strong>Gizlilik ve şeffaflık eksikliği:</strong> Çalışma bilim camiasından ve kamuoyundan saklandı.</li>
<li><strong>CCR5'in başka işlevleri</strong> vardır; örneğin Batı Nil virüsüne karşı korumayla ilişkilidir.</li>
</ul>
<p>He, Hong Kong'daki uluslararası zirvede çalışmasını savunur; ama sonunda Çin'de mahkemeye çıkarılır ve 2019 sonunda üç yıl hapis cezası alır.</p>
<div class="concept"><b class="t">Ana kavram</b><strong>Germ hattı düzenlemesi:</strong> Yumurta, sperm ya da erken embriyoda yapılan ve kalıtsal olan düzenleme. Gelecek kuşakları etkilediği için en hassas etik çizgidir.</div>`,
 learn:["He Jiankui 2018'de embriyolarında CCR5 geni düzenlenmiş ikizlerin (Lulu ve Nana) doğduğunu açıkladı.","Bu bir germ hattı düzenlemesiydi: Değişiklik tüm hücrelere ve gelecek kuşaklara geçer.","Eleştirilerin nedenleri: tıbbi gereklilik olmaması, özensiz sonuçlar (mozaiklik, hedef dışı etki), gizlilik.","He Jiankui 2019 sonunda Çin'de üç yıl hapis cezası aldı."],
 q:{
  prompt:"He Jiankui'nin deneyine yöneltilen eleştirilerden hangisi kitapta anlatılanlara UYMAZ?",
  options:[
   {t:"Düzenleme bebekleri ciddi bir genetik hastalıktan kurtarmak için tıbbi olarak zorunluydu", f:"", c:true},
   {t:"Çalışma gizli yürütüldü ve bilim camiasıyla şeffaf biçimde paylaşılmadı", f:"Bu eleştiri kitapta anlatılanlara uyar: Klinik deneme kaydı bile ikizler doğduktan sonra yapıldı ve haber bir gazetecinin araştırmasıyla ortaya çıktı."},
   {t:"Sonuçlar özensizdi; mozaiklik ve hedef dışı etki belirtileri vardı", f:"Bu da kitapta anlatılan bir eleştiridir: Lulu'da genin tek kopyası düzenlenmişti ve embriyolarda mozaiklik belirtileri vardı."},
   {t:"Babanın spermini HIV'den arındırmak bebekleri korumak için muhtemelen yeterliydi", f:"Bu da kitapta geçen bir eleştiridir: HIV'e karşı korumanın daha güvenli yolları vardı; bu yüzden germ hattı düzenlemesine tıbbi ihtiyaç yoktu."}
  ],
  good:"Doğru tespit: Düzenleme tıbbi olarak zorunlu değildi. Bebeklerde ciddi bir genetik hastalık yoktu ve HIV'den korunmanın daha güvenli yolları vardı. Eleştirinin merkezinde de bu vardı."
 }
},
{
 id:"a8", sec:"D", chapter:"Bölüm 40 ve 41 · Kırmızı çizgiler, Düşünce deneyleri",
 title:"Kırmızı çizgiler: Tedavi mi, iyileştirme mi?",
 html:`
<p class="lead">CRISPR bebeklerinden sonra Isaacson zor bir soruyu masaya koyar: Çizgiyi nereye çekmeliyiz? Kitap iki önemli ayrım önerir.</p>
<h3>1. Somatik mi, germ hattı mı?</h3>
<p>Isaacson'a göre germ hattı gerçek bir çizgidir. Bu çizginin asla aşılmaması gerekmez; ama bir <strong>yangın şeridi</strong> gibi bizi yavaşlatır ve dikkatle düşünmeye zorlar. Çünkü germ hattında yapılan bir değişiklik gelecek tüm kuşaklara geçer.</p>
<h3>2. Tedavi mi, iyileştirme mi?</h3>
<p>Bir başka çizgi, tehlikeli genetik bozuklukları düzelten <strong>tedaviler</strong> (treatments) ile insan yeteneklerini artırmaya yönelik <strong>iyileştirmeler</strong> (enhancements) arasındadır. Ama bu çizgi bulanıktır.</p>
<h3>Somut vakalarla düşünmek</h3>
<ul class="clean">
<li><strong>Huntington hastalığı:</strong> Acımasız ve ölümcüldür; mutasyonun tek bir kopyası yeterlidir. Silinmesi, korkunç mutasyon dışında hiçbir şeyi değiştirmez. Düzenleme için en güçlü örnektir.</li>
<li><strong>Orak hücre:</strong> Daha karmaşıktır. Genin tek kopyasını taşıyanlar sıtmaya karşı korunur. Genler birden çok rol oynayabilir.</li>
<li><strong>David Sanchez:</strong> Orak hücre hastası bu genç, bir belgeselde hastalığın ona sabır ve olumlu bakış öğrettiğini söyler. Isaacson onunla yeniden konuştuğunda, mümkünse çocuklarının bu hastalık olmadan doğmasını isteyeceğini, ama hastalıktan öğrendiği empatiyi onlara aktarmak istediğini anlatır.</li>
</ul>
<p>Isaacson'ın önerisi şudur: Hemen kesin kurallar koymak yerine somut vakalar üzerinden düşünmek ve her vakada hangi değerlerin çatıştığını görmek.</p>
<div class="concept"><b class="t">Ana kavram</b><strong>Tedavi ve iyileştirme:</strong> Hastalığı düzeltmek ile normal bir özelliği güçlendirmek arasındaki ayrım. Bulanık olsa da etik tartışmada en önemli rehberlerden biridir.</div>`,

{
 id:"a9", sec:"D", chapter:"Bölüm 42 ve 43 · Kim karar vermeli?, Doudna'nın etik yolculuğu",
 title:"Kim karar vermeli? Özgürlük, eşitlik, çeşitlilik",
 html:`
<p class="lead">Diyelim ki bir gün güvenli gen düzenleme mümkün oldu. Kararı kim vermeli: Ebeveynler mi, devlet mi, bilim insanları mı?</p>
<h3>Genetik süpermarket</h3>
<p>Isaacson bir düşünce deneyi yapar: Bir doğurganlık kliniğinde, bir süpermarketteki gibi, çocuğunuz için satın alabileceğiniz özelliklerin listesine bakıyorsunuz. Huntington'ı ve orak hücreyi elbette silersiniz. Peki ya boy, kas, zekâ? Herkes aynı seçimleri yaparsa toplumun <strong>çeşitliliği</strong> azalır. Üstelik zenginler çocukları için en iyi genleri satın alabilirse <strong>eşitsizlik</strong> genlerimize yazılabilir.</p>
<h3>Mutlak ve konumsal iyi</h3>
<p>Boy gibi bazı özellikler <strong>konumsal</strong> (positional) iyilerdir: Herkes uzarsa kimse avantaj kazanmaz. Virüslere karşı direnç ise <strong>mutlak</strong> (absolute) bir iyidir: Herkes için gerçekten iyidir.</p>
<h3>Tanrı'yı oynamak mı?</h3>
<p>Filozof Michael Sandel'e göre yeteneklerimizi tamamen tasarlamaya kalkarsak hayatı bir <strong>armağan</strong> olarak görmeyi bırakırız; bu da daha şanssız insanlara duyduğumuz dayanışmayı zayıflatabilir. Isaacson her şeye boyun eğmemiz gerektiğini düşünmez; ama alçakgönüllülük ister.</p>
<h3>Doudna'nın yolculuğu</h3>
<p>Doudna başta germ hattı düzenlemesine içgüdüsel olarak karşıdır. Genetik hastalığı olan çocukların aileleriyle tanıştıkça görüşü değişir. Ölçütü <strong>tıbbi gerekliliktir</strong>; "iyileştirme" için kullanılmasını ahlaki ve toplumsal olarak yanlış bulur. "Bilim geriye gitmez; bu bilgiyi unutamayız. O yüzden ihtiyatlı bir ilerleme yolu bulmalıyız."</p>
<div class="concept"><b class="t">Ana kavram</b><strong>İhtiyatlı ilerleme:</strong> Bilgiyi yasaklamak ya da her şeyi piyasaya bırakmak yerine, tıbbi gereklilik, eşitlik ve çeşitlilik gibi ölçütlerle adım adım ve şeffaf ilerlemek.</div>`,
 learn:["'Genetik süpermarket' düşünce deneyi: Kararları tamamen bireysel tercihe bırakmak çeşitliliği azaltabilir ve eşitsizliği genlere yazabilir.","Konumsal iyi (boy) herkes sahip olunca avantajını kaybeder; mutlak iyi (virüs direnci) herkes için gerçek bir kazançtır.","Sandel: Yeteneklerimizi tasarlamak hayatı bir armağan olarak görmemizi ve dayanışmayı zayıflatabilir.","Doudna'nın ölçütü tıbbi gerekliliktir; ihtiyatlı bir ilerleme yolu savunur."],
 q:{
  prompt:"Kitaba göre gen düzenleme kararlarını tamamen serbest piyasaya ('genetik süpermarket') bırakmanın en büyük riski nedir?",
  options:[
   {t:"Gen düzenlemenin daha ucuz hâle gelmesi", f:"Ucuzlama kendi başına bir risk değil; tersine erişimi artırabilir. Kitabın kaygısı, en iyi genleri yalnızca zenginlerin satın alabilmesi ve herkesin aynı seçimleri yapmasıdır."},
   {t:"Eşitsizliğin genlere yazılması ve toplumdaki çeşitliliğin azalması", f:"", c:true},
   {t:"Bilim insanlarının araştırma yapmaktan vazgeçmesi", f:"Kitapta böyle bir risk öne çıkmaz. Asıl kaygılar eşitsizlik ve çeşitliliğin kaybıdır."},
   {t:"Hastalıkların tedavisinin tamamen yasaklanması", f:"Serbest piyasa tedaviyi yasaklamaz; tam tersine her şeye izin verir. Risk, iyileştirmelerin parayla satın alınabilmesi ve toplumun tekdüzeleşmesidir."}
  ],
  good:"Zenginlerin en iyi genleri satın alabilmesi eşitsizliği kalıcı hâle getirebilir, herkesin benzer seçimler yapması da çeşitliliği azaltır. Bu yüzden kitap tamamen serbest bir 'genetik süpermarkete' karşı uyarır."
 }
},

 id:"a10", sec:"D", chapter:"Bölüm 51, 52 ve 53 · Mammoth ve Sherlock, Testler, Aşılar",
 title:"CRISPR ve COVID: Merakın meyvesi",
 html:`
<p class="lead">Mart 2020'de koronavirüs pandemisi başlayınca CRISPR hikâyesi beklenmedik bir yere varır. Bakterilerin virüslere karşı geliştirdiği savunma sistemi, insanların bir virüsle savaşında kullanılmaya başlanır.</p>
<h3>Hızlı testler: Cas12 ve Cas13</h3>
<p>Doudna'nın öğrencileri Janice Chen ve Lucas Harrington, <strong>Cas12</strong> enziminin tuhaf bir özelliğini keşfetmişti: Hedefini bulunca çevresindeki DNA'ları gelişigüzel kesiyordu. Bunu ışıldayan bir "raportör" molekülle birleştirerek bir tespit aracı (DETECTR) yaptılar ve Mammoth Biosciences'ı kurdular. Feng Zhang da RNA'yı hedefleyen <strong>Cas13</strong> ile SHERLOCK testini geliştirmişti. 2020'de iki ekip de testlerini koronavirüse uyarladı ve protokollerini herkesle ücretsiz paylaştı. Hedef, gebelik testi gibi evde kullanılabilen ucuz ve hızlı testlerdi.</p>
<h3>RNA aşıları</h3>
<p>Kitabın yıldız molekülü RNA, aşılarda da sahnededir. Haberci RNA (mRNA) aşıları, hücrelere virüsün yüzeyindeki <strong>diken proteininin</strong> (spike protein) bir parçasını yapma talimatı verir; bağışıklık sistemi de bu proteini tanımayı öğrenir. Uğur Şahin ve Özlem Türeci'nin kurduğu BioNTech (Pfizer ile) ve Moderna, bir yıl içinde büyük klinik deneylerde yüzde 90'dan fazla etkili bulunan aşılar geliştirdi (2020 verileri).</p>
<h3>Neden mümkün oldu?</h3>
<p>Bu hızlı zafer, onlarca yıllık <strong>merak güdümlü temel araştırmaya</strong> dayanır: Genlerin RNA'ya nasıl kopyalandığını ve bakterilerin virüslerle nasıl savaştığını anlamaya çalışan bilim insanlarının çalışmalarına.</p>
<div class="concept"><b class="t">Ana kavram</b><strong>Temel bilimin beklenmedik meyveleri:</strong> Bakterilerdeki tuhaf DNA tekrarlarını ya da RNA'nın işleyişini merak etmek, yıllar sonra pandemide test ve aşı olarak insanlığın imdadına yetişti.</div>`,
 learn:["Cas12 (DNA) ve Cas13 (RNA) hedefini bulunca çevredeki molekülleri gelişigüzel keser; bu özellik tespit testlerinde kullanıldı.","Mammoth (DETECTR) ve Zhang'ın ekibi (SHERLOCK) koronavirüs testlerini 2020'de ücretsiz paylaştı.","mRNA aşıları hücrelere diken proteininin bir parçasını yapma talimatı verir.","BioNTech (Uğur Şahin, Özlem Türeci) ve Moderna'nın aşıları yüzde 90'dan fazla etkili bulundu (2020).","Bu başarılar onlarca yıllık merak güdümlü temel araştırmaya dayanır."],
 q:{
  prompt:"Mammoth ve Sherlock'un CRISPR temelli testleri hangi özelliğe dayanır?",
  options:[
   {t:"Cas enzimlerinin insan genomunu kalıcı olarak değiştirmesine", f:"Testler kimsenin genomunu değiştirmez. Örnekteki virüs genetik materyalini tanıyıp bir sinyal üretmek için Cas enzimlerini kullanır."},
   {t:"Virüsün bağışıklık sistemini uyarmasına", f:"Bağışıklık sistemini uyarmak aşıların işidir. Testler, Cas12 ya da Cas13'ün hedefini tanıyınca başlattığı kesim tepkimesine dayanır."},
   {t:"Cas12 ve Cas13'ün hedefini bulunca çevredeki DNA ya da RNA'ları kesmesine ve böylece ışıldayan raportörleri açığa çıkarmasına", f:"", c:true},
   {t:"Virüsün diken proteinini hücrelere ürettirmesine", f:"Bu, mRNA aşılarının çalışma biçimidir. Testler ise virüsün genetik dizisini tanıyan Cas enzimlerinin kesim davranışını kullanır."}
  ],
  good:"Cas12 ve Cas13 hedef diziyi bulunca çevredeki DNA ya da RNA'yı gelişigüzel keser. Ortama konan ışıldayan raportörler de kesilip sinyal verir. Başta 'tuhaf' görünen bir özellik, hızlı virüs testlerinin temeli oldu."
 }
}
];

<p class="bridge">Birinci kısımda gördüğün üzere Doudna'nın yolu Çift Sarmal kitabıyla başladı. Şimdi o kitabın anlattığı hikâyeye ve öncesine bakalım.</p>
<p class="lead">Genetiğin hikâyesi Darwin ile başlar. 1835'te Galápagos Adaları'nda farklı gagalara sahip ispinozları gören Darwin, doğal seçilim (natural selection) fikrine ulaşır. Ama kalıtımın nasıl işlediğini bilmez.</p>
<p>Cevap, Brno'daki bir manastırda bezelye yetiştiren keşiş Gregor Mendel'den gelir. Mendel baskın (dominant) ve çekinik (recessive) özellikleri keşfeder; 1866'daki makalesi 1900'e kadar neredeyse hiç fark edilmez. Isaacson'a göre bilimin ilerlemesi için buluşun duyulması da gerekir.</p>
<h3>DNA'nın yapısı</h3>
<p>1944'te Oswald Avery genetik bilginin DNA'da olduğunu gösterir. 1950'lerin başında Cambridge'de James Watson ve Francis Crick, Caltech'ten Linus Pauling ile yarışarak DNA'nın yapısını çözmeye çalışır. Londra'da, King's College'da kristalograf <strong>Rosalind Franklin</strong> çok net X-ışını görüntüleri çekmektedir. Maurice Wilkins, Franklin'in izni olmadan "Fotoğraf 51"i Watson'a gösterir; görüntüdeki X deseni bir sarmalı işaret eder.</p>
<p>Watson ve Crick, adeninin timinle, guaninin sitozinle eşleştiği çift sarmal modelini 1953'te yayımlar: İki iplik ayrılınca her biri eşini yeniden kurar; molekül kendini kopyalayabilir. 1962 Nobel Ödülü Watson, Crick ve Wilkins'e verilir. Franklin 1958'de, 37 yaşında ölmüştür.</p>
<h3>Genomu okumak</h3>
<p>1990'da başlayan İnsan Genomu Projesi, üç milyar baz çiftini dizilemeyi amaçlar. Proje, Craig Venter'in şirketi Celera ile bir yarışa dönüşür ve 2000'de Beyaz Saray'da ilk sonuçlar birlikte açıklanır. Doudna'nın sorusu ise başkadır: Genleri okumak önemli, ama onları <strong>anlamak ve yazabilmek</strong> asıl hedeftir.</p>`,

   {t:"DNA'nın yapısıyla hiç ilgilenmedi; yalnızca proteinler üzerinde çalıştı", f:"Franklin King's College'da DNA kristallerinin çok net X-ışını görüntülerini çekiyordu ve yapıyı bulmaya yakındı."}
  ],

<p class="lead">Lisede bir danışman ona "Kızlar bilim insanı olmaz" der; Doudna yine de kimya okumaya karar verir. Pomona Koleji'nde ilk yıl özgüveni sarsılır ve bölümünü Fransızcaya çevirmeyi düşünür; ama Fransızca öğretmeni bile ona kimyada kalmasını önerir. Sonra Harvard'da Szostak'ın yanında RNA çalışır.</p>

<h3>Bir sapma: Genentech</h3>

<h3>Caribou ve "üçgen"</h3>

 title:"Ün, ödül ve patent kavgaları",
 html:`
<p class="lead">CRISPR'ın büyüklüğü anlaşılınca yarış laboratuvardan mahkemeye ve medyaya taşındı.</p>
<h3>Patentler</h3>
<p>Doudna ve Charpentier'in ekibi Mayıs 2012'de patent başvurusu yapar. Zhang ve Broad Enstitüsü Aralık 2012'de, insan hücrelerinde kullanımı tanımlayan başvurularını hızlandırılmış incelemeyle yapar ve Nisan 2014'te patentini önce alır. Bunun üzerine "çakışma davası" (interference proceeding) başlar. Şubat 2017'de patent hakimleri Broad'dan yana karar verir: Buluşu insan hücrelerine taşımanın "aşikâr" (obvious) olmadığını kabul ederler. Dava sonraki yıllarda da sürer (kitabın yazıldığı dönemde hâlâ bitmemişti).</p>
<h3>Ödüller ve kırgınlıklar</h3>
<p>Nobel en fazla üç kişiye verilir; büyük keşifler ise onlarca kişinin emeğidir. Doudna ve Charpentier 2014'te Atılım Ödülü'nü (Breakthrough Prize) kazanır. Bu süreçte iki bilim insanı arasındaki dostluk soğur: Charpentier temel bakteri araştırmasına dönmek ister; tanınma konusunda da hassasiyetleri farklıdır.</p>
<h3>"CRISPR'ın Kahramanları"</h3>
<p>Ocak 2016'da Broad'ın direktörü Eric Lander, Cell dergisinde "The Heroes of CRISPR" başlıklı bir makale yayımlar. Makale Mojica'dan Šikšnys'e birçok kişiyi över ama Doudna'nın rolünü küçültür ve Lander'ın kendi enstitüsündeki Zhang'ın katkısını öne çıkarır. Özellikle kadın bilim insanlarından sert tepki gelir; birçok kişi Rosalind Franklin'e yapılan haksızlığı hatırlar.</p>
<p>Isaacson'ın gözlemi: Patentler insanları kredi paylaşmakta daha az cömert yapabilir. Örneğin Zhang'a Cas9'a odaklanmasında yardım eden Luciano Marraffini sonradan ana patent başvurusundan çıkarılır.</p>`,

{
 id:"b4", chapter:"Bölüm 33 ve 34 · Biyohacking, DARPA ve Anti-CRISPR",
 title:"Garajdaki biyologlar ve biyogüvenlik",
 html:`
<p class="lead">2017'de San Francisco'daki bir konferansta biyohacker Josiah Zayner, garajında hazırladığı 299 dolarlık bir "kurbağa genetik mühendisliği kiti"ni tanıtır ve sahnede kendi koluna kas büyümesini durduran miyostatin genini hedefleyen bir CRISPR karışımı enjekte eder.</p>
<p>Zayner, Chicago Üniversitesi'nde moleküler biyofizik doktorası yapmış, NASA'da çalışmış biridir. Amacı biyolojiyi yurttaş bilimiyle (citizen science) <strong>demokratikleştirmektir</strong>. Isaacson onu biraz Shakespeare'in yaramaz cini Puck'a benzetir: Hem kural tanımaz hem de düşündürücü.</p>
<h3>Biyogüvenlik</h3>
<p>CRISPR'ın ucuz ve kolay olması tehlike de demektir. 2016'da ABD istihbaratı "genom düzenleme"yi olası kitle imha silahları listesine ekler. Pentagon'un araştırma kurumu DARPA, genetik silahlara karşı savunma için <strong>Güvenli Genler</strong> (Safe Genes) programını başlatır ve CRISPR araştırmalarının en büyük fon kaynaklarından biri olur.</p>
<h3>Anti-CRISPR</h3>
<p>Bakteriler ile virüsler arasındaki silahlanma yarışının bir sonraki hamlesi de keşfedilir: Bazı virüsler, bakterinin CRISPR sistemini sabote eden <strong>anti-CRISPR</strong> proteinleri üretir. Joe Bondy-Denomy'nin keşfettiği bu proteinler, gerektiğinde CRISPR düzenlemesini durdurmak için bir "fren" olarak kullanılabilir.</p>`,
 q:{

 id:"b5", chapter:"Bölüm 35, 36, 38 ve 39 · Yolun kuralları, Doudna sahneye çıkıyor, Hong Kong, Kabullenme",
 title:"Kuralları kim, nasıl yazar?",
 html:`
<p class="lead">Yeni bir biyoteknolojinin kurallarını belirleme çabası CRISPR'dan çok önce başladı.</p>
<h3>Asilomar, 1975</h3>
<p>Rekombinant DNA tekniğinin bulunmasından sonra Paul Berg ve David Baltimore gibi bilim insanları 1975'te Kaliforniya'daki Asilomar'da toplanır ve güvenlik kuralları belirlenene kadar bazı deneylere ara verilmesine karar verir. Asilomar, bilim insanlarının kendi alanlarını sorumlulukla düzenlemesinin sembolü olur.</p>
<h3>Hayal kırıklıkları ve uyarılar</h3>
<p><em>Gattaca</em> filmi, genetik olarak seçilmiş insanların ayrıcalıklı olduğu bir dünyayı anlatır. 1999'da 18 yaşındaki Jesse Gelsinger bir gen tedavisi denemesinde ölür ve alan yıllarca durgunlaşır.</p>
<h3>Doudna'nın kâbusu ve Napa</h3>
<p>2014'te Doudna, kendisinden gen düzenlemeyi öğrenmek isteyen Hitler'i gördüğü bir kâbus görür. Bundan sonra politika tartışmalarına girmeye karar verir: Ocak 2015'te Napa'da bir toplantı düzenler ve Aralık 2015'te Washington'da ilk Uluslararası İnsan Gen Düzenleme Zirvesi yapılır. Sonuç: Germ hattı düzenlemesinden katı koşullar sağlanana kadar kaçınılmalı, ama kalıcı bir yasak konmamalıdır.</p>
<h3>He Jiankui'den sonra</h3>
<p>2018 Hong Kong zirvesinde He Jiankui'nin açıklamaları organizatörleri sarsar. Sonrasında "moratoryum" kelimesi tartışılır: Eric Lander, Feng Zhang ve Charpentier küresel moratoryum çağrısı yaparken Doudna daha esnek bir yol, sıkı kurallarla ilerlemeyi savunur.</p>`,
 q:{
  prompt:"Asilomar konferansı (1975) bugün neyin sembolü olarak anılır?",
  options:[
   {t:"Gen düzenlemenin tamamen ve kalıcı olarak yasaklanmasının", f:"Asilomar kalıcı bir yasak getirmedi; güvenlik kuralları belirlenene kadar geçici bir ara verdi ve sonra araştırma kurallar çerçevesinde sürdü."},
   {t:"Bilim insanlarının yeni bir teknolojiyi sorumlulukla, kendi aralarında düzenlemeye çalışmasının", f:"", c:true},
   {t:"Bir şirketin CRISPR patentini kazanmasının", f:"Asilomar 1975'te, CRISPR'dan onlarca yıl önce, rekombinant DNA tekniği üzerine yapıldı; patentle ilgisi yoktur."}
  ],
  good:"Doğru. Asilomar, bilim insanlarının riskleri tartışıp kurallar belirlediği bir öz düzenleme örneğidir. Doudna da Napa toplantısında bu modeli örnek aldı ve buna etik soruları ekledi."
 }

 id:"b6", chapter:"Bölüm 41 · Düşünce deneyleri",
 title:"Düşünce deneyleri: Sağırlık, spor, boy, zekâ",
 html:`
<p class="bridge">Birinci kısımda Huntington ve orak hücre örnekleriyle tedavi ile iyileştirme ayrımını gördün. Kitap başka zor vakaları da tartışır.</p>
<h3>Sağırlık ve tersine çevirme testi</h3>
<p>İkisi de sağır olan bir çift, sağırlığı kimliklerinin parçası olarak görür ve sağır bir sperm donörü seçerek sağır bir çocuk sahibi olur. Kimi kınar, sağır topluluğu alkışlar. Filozof Michael Sandel'in <strong>tersine çevirme testi</strong> (reversal test) yardımcı olur: Sağır doğacak bir çocuğu duyar hâle getirmek doğal görünür; duyacak bir çocuğu sağır yapmak ise çoğumuzu irkiltir.</p>
<h3>Kaslar ve spor</h3>
<p>Olimpiyat şampiyonu kayakçı Eero Mäntyranta dopingle suçlanır; ama kırmızı kan hücresi sayısını yüzde 25'ten fazla artıran doğal bir mutasyon taşıdığı anlaşılır. Doğanın genetik piyangosu da adil değildir: Neredeyse her şampiyon koşucu ACTN3 geninin belirli bir varyantını taşır.</p>
<h3>Boy: konumsal iyi</h3>
<p>Herkes 20 santim uzarsa kimse daha iyi görmez; boy <strong>konumsal</strong> (positional) bir iyidir. Virüslere karşı direnç ise herkes için <strong>mutlak</strong> (absolute) bir iyidir.</p>
<h3>Ruh hâli ve zekâ</h3>
<p>Ağır psikolojik hastalıklar acı verir; ama Nancy Andreasen'in otuz önemli yazar üzerinde yaptığı çalışmada yirmi dördünün ağır depresyon ya da duygu durum bozukluğu yaşadığı görülmüştür. Filozof Robert Nozick'in "deneyim makinesi" (experience machine) bize hep mutlu hissettirseydi ona bağlanır mıydık? Çoğumuz hayır deriz: İyi bir hayatın daha derin amaçları vardır.</p>`,
 q:{
  prompt:"Kitaptaki 'konumsal iyi' kavramına en iyi örnek hangisidir?",
  options:[
   {t:"Virüslere karşı direnç", f:"Virüs direnci herkes sahip olsa bile herkes için gerçek bir kazançtır; bu yüzden kitapta 'mutlak iyi' örneğidir."},
   {t:"Huntington hastalığından kurtulmak", f:"Bu bir hastalığın tedavisidir ve herkes için mutlak bir kazançtır; başkalarıyla kıyaslamaya bağlı değildir."},
   {t:"Boy uzunluğu; herkes uzarsa kimse avantaj kazanmaz", f:"", c:true}
  ],
  good:"Doğru. Boyun avantajı başkalarından uzun olmaya bağlıdır; herkes uzarsa kazanç kaybolur. Bu yüzden boy konumsal bir iyidir."
 }

 id:"b7", chapter:"Bölüm 44-47 · Quebec, Gen düzenlemeyi öğreniyorum, Watson'a yeniden bakış, Doudna'nın ziyareti",
 title:"Cepheden notlar: Laboratuvarda bir gün ve Watson",
 html:`
<p class="lead">Isaacson bu bölümlerde kendisi sahneye çıkar.</p>
<h3>Quebec, 2019</h3>
<p>CRISPR konferansında Sam Sternberg'in "zıplayan genler" (jumping genes) makalesi Nature'a önce gönderilmiştir, ama Zhang'ın benzer makalesi Science'ta birkaç gün önce çıkar. Rekabet sürer. Akşam yemeğinde Zhang, iyileştirmelere neden karşı olduğu sorusuna uzun bir sessizlikten sonra "Doğayla oynamak; çeşitliliği azaltabilirsin" diye cevap verir. Masadakilerin ortak kaygısı eşitsizliktir.</p>
<h3>Isaacson gen düzenliyor</h3>
<p>Doudna'nın laboratuvarında doktora sonrası araştırmacı Gavin Knott ile deney tüpünde DNA keser ve sonucu jel elektroforeziyle (electrophoresis) görür. Jennifer Hamilton ile bir insan hücresinde gen düzenler: Düzenlenen hücreler floresan mikroskopta yeşil parlar. Isaacson sürecin, laboratuvar becerisi olan biri için ne kadar kolay olabileceğini görür.</p>
<h3>Watson ve "mozaik" insanlar</h3>
<p>DNA'nın çift sarmalının kâşiflerinden James Watson, ırk ve zekâ hakkındaki bilimsel temeli olmayan sözleri yüzünden Cold Spring Harbor Laboratuvarı'ndaki unvanlarını kaybeder. Şizofreni hastası oğlu Rufus, babasının sözlerinin "genetik kader hakkındaki dar bir yorumu" yansıttığını söyler. Doudna Watson'ı ziyaret ettikten sonra şöyle der: İnsanlar siyah-beyaz değildir; biyolojideki bir terimle <strong>mozaiktir</strong> (mosaic). Büyük katkıları takdir edip yanlış görüşleri açıkça reddedebiliriz.</p>`,

  prompt:"Doudna, Watson'ı ziyaretinden sonra insanları anlatmak için biyolojiden hangi kavramı benimser?",
  options:[
   {t:"Mozaik: Herkesin hem çok iyi hem de kusurlu yanları bir arada bulunur", f:"", c:true},
   {t:"Klon: İnsanlar ailelerinin aynısıdır", f:"Doudna tam tersine insanları basit kalıplarla yargılamaktan kaçınır. Rufus'un da belirttiği gibi genetik kader görüşü dar bir yorumdur."},
   {t:"Baskın gen: İnsanın tek bir özelliği diğer her şeyi belirler", f:"Doudna bir kişinin tek bir yanına bakarak yargıya varmak istemez; tersine karmaşıklığı görmeye çalışır."}

 id:"b8", chapter:"Bölüm 48, 49, 50 ve 54 · Silah başına, Test, Berkeley laboratuvarı, CRISPR tedavileri",
 title:"Pandemide bilim seferberliği",
 html:`
<p class="lead">13 Mart 2020'de Doudna, Berkeley'deki Yenilikçi Genomik Enstitüsü'nde (IGI) bir toplantı çağırır. Profesör Robert Tjian işi netleştirir: Önce acil yangını söndürmek, yani test yapmak gerekir; yenilikler sonra.</p>
<h3>Amerika'nın test başarısızlığı</h3>
<p>ABD'de CDC'nin ilk test kitlerinde bir kimyasal üretim sırasında kirlenmiştir ve kitler hatalı sonuç verir. Washington Üniversitesi'nden Alex Greninger kendi testini iki haftada geliştirir, ama izin için yaklaşık yüz saat form doldurur ve FDA başvurunun bir kopyasını CD ile postalamasını ister. Sonunda kurallar gevşetilir ve üniversite laboratuvarları devreye girer.</p>
<h3>Gönüllü ordusu</h3>
<p>IGI'nin gönüllü çağrısına iki günde 860'tan fazla kişi yanıt verir. Fyodor Urnov, Jennifer Hamilton ve Enrique Lin Shiao birkaç haftada otomatik bir test laboratuvarı kurar; 6 Nisan'da itfaiyeden ilk örnekler gelir. Bir gün kapıda bir not bulurlar: "Teşekkürler IGI! Berkeley ve dünya halkı."</p>
<h3>Virüsü doğrudan yok etmek</h3>
<p>Uzun vadeli hedef bakterilerin yaptığını yapmaktır: Virüsün genetik materyalini CRISPR ile doğramak. Cameron Myhrvold'un <strong>CARVER</strong> ve Stanley Qi'nin <strong>PAC-MAN</strong> sistemleri RNA'yı kesen Cas13'ü kullanır; PAC-MAN laboratuvarda sentetik koronavirüs parçalarını yüzde 90 azaltır. Asıl zorluk <strong>teslimattır</strong>: Enzimi akciğer hücrelerine nasıl ulaştıracağız?</p>`,

  prompt:"CARVER ve PAC-MAN gibi CRISPR tedavilerinin 2021'de hâlâ insanlarda kullanılamamasının ana nedeni neydi?",
  options:[
   {t:"Cas13'ün RNA'yı kesememesi", f:"Laboratuvar deneylerinde Cas13 virüs RNA'sını başarıyla kesti; PAC-MAN sentetik koronavirüs parçalarını yüzde 90 azalttı."},
   {t:"Enzimi hastanın doğru hücrelerine, özellikle akciğer hücrelerine ulaştırmanın (teslimat) zor olması", f:"", c:true},
   {t:"Hiçbir bilim insanının bu konuyla ilgilenmemesi", f:"Tersine Myhrvold, Qi, Hsu, Wilson ve diğerleri yoğun biçimde çalıştı; DARPA da fon sağladı. Sorun ilgisizlik değil teslimattı."}
  ],

 }

 html:`
<p class="lead">9 Ekim 2020'de saat 02.53'te Doudna'nın telefonu çalar: Emmanuelle Charpentier ile birlikte Nobel Kimya Ödülü'nü kazanmıştır. Buluş yalnızca sekiz yaşındadır.</p>
<h3>Tarihî bir ödül</h3>
<p>Ödülün iki kadına gitmesi de tarihîdir: 2020'ye kadar kimya ödülü alan 184 kişiden yalnızca beşi kadındı. Charpentier, bunun genç kızlara güçlü bir mesaj olduğunu söyler. Isaacson, Rosalind Franklin'in hayaletinin gülümsediğini hayal eder.</p>
<h3>CRISPR ilerliyor</h3>
<p>David Liu'nun geliştirdiği <strong>baz düzenleme</strong> (base editing) DNA'yı kesmeden tek bir harfi değiştirir; <strong>prime düzenleme</strong> (prime editing) daha uzun dizileri yazabilir. Liu'nun benzetmesiyle CRISPR-Cas9 makas, baz düzenleyiciler kurşun kalem, prime düzenleyiciler kelime işlemci gibidir.</p>
<h3>Bilim nasıl değişti?</h3>
<p>Pandemide bilim insanları verilerini açık veri tabanlarında ve ön baskı (preprint) sunucularında hızla paylaştı. Ağustos 2020'de ABD'de tıp fakültesi başvuruları bir önceki yıla göre yüzde 17 arttı. Charpentier'in sözüyle: "Günün sonunda kalıcı olan keşiflerdir."</p>
<h3>Sonsöz: Merak</h3>
<p>Isaacson New Orleans'taki balkonundan öğrencilere seslenir: Yeniden başlasaydı yaşam bilimlerine çok daha fazla odaklanırdı. Onun kuşağı çocuklarına kod yazmayı öğretti; şimdi <strong>yaşamın kodunu</strong> anlamak gerekiyor. Leonardo'nun "Ağaçkakanın dilini tarif et" notunu hatırlatır. Ve ekler: Acele etmeden, adım adım ve el ele ilerlemeliyiz.</p>`,

 });

 .then(function(res){ return res.json().catch(function(){return {};}).then(function(j){return {ok:res.ok,j:j};}); })
 .then(function(o){
  var succ = o.ok && (o.j.success===true || o.j.success==="true");
  if(succ){ S.sentAt=new Date().toISOString(); save(); status("ok","Teşekkürler! Sonuçların Işıl Tabağ'a başarıyla gönderildi."); }
  else if(o.j && o.j.message && /activat/i.test(o.j.message)){ status("no","Gönderim henüz tamamlanamadı: Bu form ilk kez kullanıldığı için Işıl Tabağ'ın e-posta adresine bir onay bağlantısı gönderildi. Onaylandıktan sonra lütfen yeniden gönder. Bu arada sonuçlarını indirmeyi unutma."); }
  else { status("no","Gönderim sırasında bir sorun oluştu. Lütfen biraz sonra tekrar dene; olmazsa sonuçlarını indirip dosyayı Işıl Tabağ'a e-postayla gönderebilirsin."); }
 })
 .catch(function(){ status("no","Gönderilemedi. İnternet bağlantını kontrol edip tekrar dene; olmazsa sonuçlarını indirip dosyayı Işıl Tabağ'a e-postayla gönderebilirsin."); })
 .then(function(){ clearTimeout(to); sending=false; var b=$("btnSend"); if(b){ b.disabled=false; b.textContent="Işıl Tabağ'a Gönder"; } });
}
